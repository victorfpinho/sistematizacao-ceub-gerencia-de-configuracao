name: Python CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependências de teste
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: Executar os testes unitários
      run: |
        pytest test_conversor.py

  report-build-status:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Reportar Status do Build
      run: echo "O build e os testes passaram com sucesso no ambiente de staging!"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Simular Deploy em Produção
      run: |
        echo "Iniciando implantação do Conversor de Moedas..."
        echo "Versão liberada para uso!"
